background {
    monitor = DP-3
    path = /usr/share/backgrounds/girlsundpanzer.jpg
    blur_passes = 3
    blur_size = 8
}

label {
    text = cmd[update:1000] date +%H:%M
    font_size = 96
    color = rgba(255, 255, 255, 0.9)
    position = 0, 40
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date '+%A, %B %d'
    font_size = 28
    color = rgba(255, 255, 255, 0.7)
    position = 0, -50
    halign = center
    valign = center
}

input-field {
    monitor = DP-3
    size = 400, 60
    rounding = 0
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = rgba(255, 255, 255, 0.6)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgba(255, 255, 255, 0.8)
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}
